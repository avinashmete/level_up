name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Shared module · common unit tests
        run: gradle --no-daemon :shared:testDebugUnitTest --stacktrace

      - name: Android app · assembleDebug
        run: gradle --no-daemon :androidApp:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: levelup-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  ios-shared:
    name: iOS · compile shared framework
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Link iOS Simulator framework (arm64)
        run: gradle --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload framework
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: levelup-ios-shared-framework
          path: shared/build/bin/iosSimulatorArm64/debugFramework/
          if-no-files-found: warn
          retention-days: 14
